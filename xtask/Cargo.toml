[package]
name = "xtask"
description = "Development tasks of the fvoci workspace: cargo xtask check, test, openapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
# Reading the sources for the checks. Lines come from the spans,
# which `span-locations` keeps outside a procedural macro. License: MIT OR Apache-2.0.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }

[lints]
workspace = true
