# cargo-deny configuration for the fvoci workspace.
#
#   cargo deny check
#
# The workspace is distributed under the MIT license, so every dependency must carry a
# license that permits that: permissive licenses only, nothing copyleft.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # The SQLite bundled by libsqlite3-sys < 0.39 can return stale memory when it opens a
    # database together with a crafted `-wal` file of another page size. The server only
    # opens the database file its operator configures. sqlx 0.9.0, the newest release,
    # does not accept libsqlite3-sys 0.39 yet; remove this entry when it does.
    { id = "RUSTSEC-2026-0459", reason = "no sqlx release accepts the fixed libsqlite3-sys yet; the server opens only the operator's own database file" },
    # smallstr, a small-string type that yrs (the Y documents of crates/collab) builds
    # on, is no longer maintained. The advisory is a notice of that and names no
    # vulnerability (`informational = "unmaintained"`, no affected function). yrs 0.28.1,
    # the newest release, depends on it. Remove this entry when a yrs release no longer
    # does, or when an advisory names a vulnerability in smallstr (which gets its own
    # identifier and fails this check again).
    { id = "RUSTSEC-2026-0215", reason = "a notice that smallstr is unmaintained, not a vulnerability; yrs 0.28.1, the newest release, depends on it" },
    # chrono, chrono-tz and humantime are no longer maintained (notices of 2026-11, no
    # vulnerability named, every release affected). crates/model reads time zones with
    # chrono-tz, which brings chrono; object_store (S3 files) brings chrono and humantime.
    # Remove an entry when the crate is gone from the tree (chrono-tz for jiff, an
    # object_store release without the other two), or when an advisory names a
    # vulnerability in it (which gets its own identifier and fails this check again).
    { id = "RUSTSEC-2026-0543", reason = "a notice that chrono is unmaintained, not a vulnerability; chrono-tz and object_store depend on it" },
    { id = "RUSTSEC-2026-0555", reason = "a notice that chrono-tz is unmaintained, not a vulnerability; crates/model reads time zones with it until it moves to jiff" },
    { id = "RUSTSEC-2026-0542", reason = "a notice that humantime is unmaintained, not a vulnerability; object_store 0.14.2, the newest release, depends on it" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The crates of this workspace depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
