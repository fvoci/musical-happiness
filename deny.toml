# cargo-deny configuration for the fvoci workspace.
#
#   cargo deny check
#
# The workspace is distributed under the MIT license, so every dependency must carry a
# license that permits that: permissive licenses only, nothing copyleft.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # The SQLite bundled by libsqlite3-sys < 0.39 can return stale memory when it opens a
    # database together with a crafted `-wal` file of another page size. The server only
    # opens the database file its operator configures. sqlx 0.9.0, the newest release,
    # does not accept libsqlite3-sys 0.39 yet; remove this entry when it does.
    { id = "RUSTSEC-2026-0459", reason = "no sqlx release accepts the fixed libsqlite3-sys yet; the server opens only the operator's own database file" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The crates of this workspace depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
