# The whole verification of a change: what `cargo xtask check`, `cargo xtask test` and
# the web app's `check`, `test`, `build`, `test:storybook`, `e2e`, `e2e:apple` and
# `e2e:live` do on a developer's machine, cut into jobs that fit a runner of four
# processors. `ci-done` is the one check that stands for all of them.
#
# The repository is public and anyone may send a pull request, so:
# - it runs on `pull_request` only, never with more than the right to read, and uses
#   no secret;
# - every action is pinned to a commit, every downloaded tool to a SHA-256;
# - no text from outside (titles, branch names, messages) reaches a shell;
# - only a run on master writes a cache. A pull request reads them and writes none:
#   what one pull request built never reaches another.
name: ci

on:
  # Whatever the base: the pull requests of a stack have the branch below as theirs.
  pull_request:
  # Master after a merge: the merged tree itself, and the run that writes the caches.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer run of a pull request, or of a branch started by hand, ends the older one.
# The runs of master are one per commit, and all of them finish.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The runner
        run: |
          nproc
          free --giga
          df --human-readable / /mnt || true
          docker version --format '{{.Server.Version}}'
      - name: Fetch actionlint and zizmor
        run: |
          .github/scripts/pinned-tool.sh \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            actionlint "$RUNNER_TEMP/bin"
          .github/scripts/pinned-tool.sh \
            https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b \
            zizmor "$RUNNER_TEMP/bin"
      - name: actionlint
        run: |
          "$RUNNER_TEMP/bin/actionlint" -color
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh
      # With the token (it can only read) zizmor also asks GitHub whether a pinned
      # commit belongs to the action's repository and carries the version beside it.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/bin/zizmor" --color always .github

  rust-check:
    name: cargo xtask check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          cache: check
          save: 'true'
      # Where `cargo xtask check` looks first for it.
      - name: Fetch cargo-deny
        run: |
          .github/scripts/pinned-tool.sh \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny target/tools/bin
      - run: cargo xtask check

  rust-sqlite:
    name: cargo xtask test (SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          cache: workspace-tests
          save: 'true'
      - run: cargo xtask test --database sqlite

  rust-postgres:
    name: cargo xtask test (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          cache: server-tests
          save: 'true'
      # xtask starts the PostgreSQL container itself, as on a developer's machine.
      - run: cargo xtask test --database postgres

  # `cargo xtask test` runs these only together with both databases, which is too long
  # for one job: the three commands are those of `s3_tests` in xtask/src/test.rs.
  # Change one with the other.
  rust-s3:
    name: cargo xtask test (S3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          cache: server-tests
      - run: .github/scripts/test-services.sh postgres s3
      - name: The storage test
        run: cargo test --locked --package fvoci-server --test storage -- --ignored
      - name: Uploads in parts that go to S3
        run: cargo test --locked --package fvoci-server --test api -- --ignored with_s3
      - name: The files of two organizations in one bucket
        env:
          FVOCI_STORE_TEST_DB_TYPE: postgres
        run: |
          cargo test --locked --package fvoci-server --test organization_boundary_round2 -- \
            --ignored --exact \
            media::s3_files_tokens_uploads_and_housekeeping_stay_in_their_organizations

  web-check:
    name: web check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/web
        with:
          fonts: 'true'
          save: 'true'
      - run: pnpm --filter web run check

  web-test:
    name: web test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/web
        with:
          fonts: 'true'
      - run: pnpm --filter web run test

  # Built once: every end-to-end job tests this build.
  web-build:
    name: web build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/web
        with:
          fonts: 'true'
      - run: pnpm --filter web run build
      - name: Pack the build
        run: tar --create --gzip --file "$RUNNER_TEMP/web-dist.tar.gz" --directory apps/web dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: ${{ runner.temp }}/web-dist.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  web-storybook:
    name: web test:storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/web
        with:
          fonts: 'true'
          browser: chromium
      - run: pnpm --filter web run test:storybook
      - name: Keep the traces of the failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-storybook
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  web-e2e:
    name: web e2e (${{ matrix.shard }}/6)
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/web
        with:
          browser: chromium
          save: ${{ matrix.shard == 1 }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: ${{ runner.temp }}
      - name: Unpack the build
        run: tar --extract --gzip --file "$RUNNER_TEMP/web-dist.tar.gz" --directory apps/web
      - env:
          SHARD: ${{ matrix.shard }}/6
        run: pnpm --filter web run e2e --shard="$SHARD"
      - name: Keep the traces of the failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-e2e-${{ matrix.shard }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  # WebKit, installed on the runner with the libraries Playwright names for it.
  web-e2e-apple:
    name: web e2e:apple (${{ matrix.shard }}/8)
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/web
        with:
          browser: webkit
          save: ${{ matrix.shard == 1 }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: ${{ runner.temp }}
      - name: Unpack the build
        run: tar --extract --gzip --file "$RUNNER_TEMP/web-dist.tar.gz" --directory apps/web
      - env:
          SHARD: ${{ matrix.shard }}/8
        run: pnpm --filter web run e2e:apple --shard="$SHARD"
      - name: Keep the traces of the failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-e2e-apple-${{ matrix.shard }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  # The real server, built here, serving the build of `web-build`. One worker, as
  # playwright.live.config.ts says: the tests share one server and one database.
  web-e2e-live:
    name: web e2e:live
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          cache: server-tests
      - name: Build the server and the fakes beside it
        run: cargo build --locked --package fvoci-server --bins --examples
      - uses: $/.github/actions/web
        with:
          browser: chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: ${{ runner.temp }}
      - name: Unpack the build
        run: tar --extract --gzip --file "$RUNNER_TEMP/web-dist.tar.gz" --directory apps/web
      # The server of the second organization runs on PostgreSQL.
      - run: .github/scripts/test-services.sh postgres
      - run: pnpm --filter web run e2e:live
      - name: Keep the traces of the failed tests and the servers' logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-e2e-live
          path: |
            apps/web/test-results/
            target/web-live/*/server.log
          if-no-files-found: ignore
          retention-days: 3

  # The one check to require. It runs whatever became of the others, and passes only
  # when every one of them passed: a job that failed, was cancelled or was skipped
  # fails it. A job added above must be added to `needs` here: the step before the
  # verdict fails when one is missing.
  ci-done:
    name: ci-done
    if: ${{ always() }}
    needs:
      - workflows
      - rust-check
      - rust-sqlite
      - rust-postgres
      - rust-s3
      - web-check
      - web-test
      - web-build
      - web-storybook
      - web-e2e
      - web-e2e-apple
      - web-e2e-live
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Every job is one this job waits for
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # The jobs of the workflow, as the keys under `jobs:` at two spaces.
          written=$(sed -n '/^jobs:/,$p' .github/workflows/ci.yml |
            sed -n 's/^  \([a-z][a-z0-9-]*\):$/\1/p' | grep -v '^ci-done$' | sort)
          waited=$(jq --raw-output 'keys[]' <<<"$NEEDS" | sort)
          diff <(echo "$written") <(echo "$waited")
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --raw-output 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$NEEDS"
          jq --exit-status 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
