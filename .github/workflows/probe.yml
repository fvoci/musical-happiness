# Temporary, removed before this branch is merged: the WebKit tests that failed on a
# runner even with one worker, five times each, to tell which fail always and which
# sometimes.
name: probe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  webkit:
    name: webkit, five times each
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/web
        with:
          fonts: 'true'
      - run: pnpm --filter web run build
      - run: .github/scripts/webkit-server.sh
      - name: The tests that failed with one worker
        run: |
          pnpm --filter web run e2e:apple --workers=1 --repeat-each=5 \
            carets.spec.ts:226 file-viewer-xlsx.spec.ts:87 file-viewer-xlsx.spec.ts:344 \
            file-viewer-xlsx.spec.ts:358 view-header.spec.ts:1227 gantt-many.spec.ts:188 \
            table.spec.ts:1239
