[package]
name = "fvoci-server"
description = "The fvoci board server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fvoci-server"
path = "src/main.rs"

[dependencies]
fvoci-collab.workspace = true
fvoci-model.workspace = true
fvoci-store.workspace = true

anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
httpdate.workspace = true
object_store.workspace = true
prometheus.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util", "process"] }
tokio-rustls.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Test support for this crate's tests: a file storage that fails when a test asks it to.
test-util = []

[dev-dependencies]
brotli.workspace = true
fvoci-collab = { workspace = true, features = ["test-util"] }
fvoci-server = { path = ".", features = ["test-util"] }
fvoci-store = { workspace = true, features = ["test-util"] }
rcgen.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
zip.workspace = true
zstd.workspace = true

[lints]
workspace = true
