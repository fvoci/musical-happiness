[workspace]
resolver = "3"
members = ["crates/model"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
fvoci-model = { path = "crates/model" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }

# Lints from the BeautifulRust `lints/lints.toml`. Everything is "warn"; CI and the
# local gate run clippy with `-D warnings`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

# The crates in this workspace are not published and are matched exhaustively across
# crate boundaries on purpose, so that adding a variant is a compile error at every
# use site. The upstream config warns on exported enums that are not #[non_exhaustive].
exhaustive_enums = "allow"

string_add = "warn"
wildcard_imports = "warn"

dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
